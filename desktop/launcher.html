<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'">
  <title>SnapStitch Desktop</title>
  <link rel="stylesheet" href="../src/popup.css">
  <style>
    /* Frameless window: draw the edge the browser popup gets for free. */
    html { height: 100%; box-sizing: border-box; border: 1px solid var(--kbd-border); background: var(--bg); }
    .target { margin: 6px 10px 2px; color: var(--muted); font-size: 11px; }
  </style>
</head>
<body>
  <section id="idle">
    <h2>Screenshot <small>desktop</small></h2>
    <button data-action="screen-area">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5"/></svg>
      <span class="name">Select area</span>
      <kbd data-hotkey="screen-area"></kbd>
    </button>
    <button data-action="screen">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="13" rx="2"/><path d="M9 21h6M12 17v4"/></svg>
      <span class="name">Full screen</span>
      <kbd data-hotkey="screen"></kbd>
    </button>
    <button data-action="screens">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="1.5" y="6" width="9" height="8" rx="1.5"/><rect x="13.5" y="6" width="9" height="8" rx="1.5"/><path d="M6 18h12"/></svg>
      <span class="name">All screens</span>
    </button>

    <h2>Record <small>MP4 / GIF</small></h2>
    <button data-action="record-screen-area">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5"/><circle class="rec" cx="12" cy="12" r="3"/></svg>
      <span class="name">Select area</span>
      <kbd data-hotkey="record-screen-area"></kbd>
    </button>
    <button data-action="record-screen">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="13" rx="2"/><path d="M9 21h6M12 17v4"/><circle class="rec" cx="12" cy="10.5" r="3"/></svg>
      <span class="name">Full screen</span>
      <kbd data-hotkey="record-screen"></kbd>
    </button>
  </section>

  <section id="recording" hidden>
    <div class="status"><span class="dot"></span>Recording <span id="elapsed">0:00</span></div>
    <button data-action="stop" class="stop">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="1.5"/></svg>
      <span class="name">Stop and save</span>
      <kbd data-hotkey="record-screen-area"></kbd>
    </button>
    <button data-action="discard">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
      <span class="name">Discard</span>
    </button>
  </section>

  <div class="target" id="target"></div>
  <script src="launcher.js" type="module"></script>
</body>
</html>
