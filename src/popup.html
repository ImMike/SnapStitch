<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>SnapStitch</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <section id="idle">
    <h2>Screenshot</h2>
    <button data-mode="region">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5"/></svg>
      <span class="name">Select area</span>
      <kbd data-command="capture-region"></kbd>
    </button>
    <button data-mode="visible">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 8h18"/></svg>
      <span class="name">Visible page</span>
      <kbd data-command="capture-visible"></kbd>
    </button>
    <button data-mode="full">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="2" width="14" height="20" rx="2"/><path d="M5 9h14M5 15h14"/></svg>
      <span class="name">Whole page</span>
      <kbd data-command="capture-full"></kbd>
    </button>

    <h2>Record <small>MP4 / GIF</small></h2>
    <button data-mode="record-area">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5"/><circle class="rec" cx="12" cy="12" r="3"/></svg>
      <span class="name">Select area</span>
      <kbd data-command="record-area"></kbd>
    </button>
    <button data-mode="record-visible">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><circle class="rec" cx="12" cy="12" r="3"/></svg>
      <span class="name">Visible page</span>
      <kbd data-command="record-visible"></kbd>
    </button>
    <a href="#" id="shortcuts">Change shortcuts</a>
  </section>

  <section id="recording" hidden>
    <div class="status"><span class="dot"></span>Recording <span id="elapsed">0:00</span></div>
    <button id="stop" class="stop">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="1.5"/></svg>
      <span class="name">Stop and save</span>
      <kbd data-command="record-area"></kbd>
    </button>
    <button id="discard">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
      <span class="name">Discard</span>
    </button>
  </section>
  <script src="popup.js" type="module"></script>
</body>
</html>
